<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c171b">
<title>Дальномір - БАРС</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0c171b;--panel:rgba(12,23,27,.9);--ink:#e9efe6;--mute:#8fa3a0;--amb:#ffb21e;--red:#ff5a3c;--line:rgba(233,239,230,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:32px;color:var(--mute)}
#msg button{margin-top:14px}
.mk{position:absolute;pointer-events:none}
.v .mk{left:0;right:0;height:0;border-top:2px solid var(--amb)}
.h .mk{top:0;bottom:0;width:0;border-left:2px solid var(--amb)}
.mk i{position:absolute;width:48px;height:48px;pointer-events:auto;touch-action:none;display:grid;place-items:center}
.mk i::after{content:"";width:20px;height:20px;border-radius:50%;background:var(--amb);border:3px solid var(--bg)}
.v .mk i{right:10px;top:-24px}
.h .mk i{bottom:calc(var(--sh,230px) + 12px);left:-24px}
.mk:nth-child(2){border-color:var(--red)}.mk:nth-child(2) i::after{background:var(--red)}
#cross{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;pointer-events:none;display:none}
#cross::before,#cross::after{content:"";position:absolute;background:var(--amb)}
#cross::before{left:50%;top:0;bottom:0;width:2px;margin-left:-1px;-webkit-mask:linear-gradient(#000 35%,transparent 35% 65%,#000 65%);mask:linear-gradient(#000 35%,transparent 35% 65%,#000 65%)}
#cross::after{top:50%;left:0;right:0;height:2px;margin-top:-1px;-webkit-mask:linear-gradient(90deg,#000 35%,transparent 35% 65%,#000 65%);mask:linear-gradient(90deg,#000 35%,transparent 35% 65%,#000 65%)}
#cross b{position:absolute;inset:32px;border-radius:50%;border:2px solid var(--amb)}
#top{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 8px 0;display:flex;gap:4px}
.tab{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--mute);font:inherit;font-size:12px;font-weight:600}
.tab.on{color:var(--bg);background:var(--amb);border-color:var(--amb)}
#cmp{position:absolute;left:10px;top:calc(58px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:12px;pointer-events:none}
#cmp b{font-weight:600;font-variant-numeric:tabular-nums}
#cmp span{color:var(--amb)}
#tr{position:absolute;right:8px;top:calc(58px + env(safe-area-inset-top,0px));display:flex;gap:6px}
.tb{padding:5px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:12px;font-weight:600;line-height:1.3}
.tb.on{border-color:var(--red);color:var(--red)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:50vh;overflow-y:auto;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 14px calc(8px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0}
#sheet.min #ctl{display:none}
#read{display:flex;align-items:baseline;gap:10px}
#num{font:700 60px/1 "Arial Narrow","Roboto Condensed",system-ui,sans-serif;font-variant-numeric:tabular-nums}
#unit{font:600 24px system-ui,sans-serif;color:var(--amb)}
#sub{margin-left:auto;text-align:right;color:var(--mute);font-size:13px}
#col{align-self:center;padding:6px 12px;font-size:18px;line-height:1}
#warn{color:var(--amb);font-size:13px;min-height:18px}
#res{font-size:13px}
#lvl{font-size:13px;color:var(--mute);margin-top:4px}#lvl.bad{color:var(--red)}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row label{color:var(--mute);font-size:13px;flex:0 0 auto}
select,input,button{font:inherit;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0}
input[type=number]{width:84px}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--amb)}
select{flex:1}
button{cursor:pointer;font-weight:600}
.row>button{flex:1;padding:9px 4px;font-size:14px}
button.pri{background:var(--amb);color:var(--bg);border-color:var(--amb)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
input[type=range]{flex:1;padding:0;accent-color:var(--amb)}
.hide{display:none!important}
small{color:var(--mute);font-size:12px;display:block;margin-top:6px}
.ft{text-align:center;color:var(--mute);font-size:10.5px;line-height:1.35;margin-top:10px;letter-spacing:.2px}
#pick{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.sr .sn{flex:1;min-width:0}
.sr .sn small{margin:0}
.sr b{white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--amb);flex:0 0 auto}.dot.st{background:var(--mute)}
#db{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(8px + env(safe-area-inset-bottom,0px))}
.dbh{display:flex;gap:8px}
#dbq{flex:1}
.seg{display:flex;gap:6px;padding-top:10px}
.seg .chip{flex:1;padding:9px 6px;border-radius:10px}
#chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;flex:0 0 auto}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:99px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--amb);color:var(--bg);border-color:var(--amb)}
#cnt{color:var(--mute);font-size:12px;padding-bottom:6px}
#dbl{flex:1;overflow-y:auto;border-top:1px solid var(--line)}
.it{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:12px 4px;font-weight:500}
.it b{color:var(--amb);white-space:nowrap;font-variant-numeric:tabular-nums}
.it i{font-style:normal;color:var(--mute);padding:4px 8px;margin-left:6px}
.dba{display:flex;gap:6px;margin-top:8px}
.dba input:first-child{flex:1}
.dba input[type=number]{width:90px}
.fs{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(8px + env(safe-area-inset-bottom,0px))}
.fsh{display:flex;align-items:center;gap:8px}
.fsh h2{margin:0;font-size:18px;flex:1}
.fsb{flex:1;overflow-y:auto;margin-top:10px;padding-bottom:10px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:rgba(255,255,255,.03)}
.card h3{margin:0 0 4px;font-size:15px}
.card input[type=text],.card input[type=password],.card input[type=number]{width:100%}
.card .row>input{flex:1;width:auto}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.lk{width:100%;max-width:320px;text-align:center}
.lk h2{margin:0 0 4px}
#lkMsg{color:var(--mute);min-height:20px}
#dots{display:flex;gap:12px;justify-content:center;margin:16px 0}
#dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--amb)}
#dots i.f{background:var(--amb)}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#pad button{padding:16px 0;font-size:22px;border-radius:14px}
details.mn{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:0 12px;background:rgba(255,255,255,.03)}
details.mn summary{padding:12px 0;font-weight:600;color:var(--ink);margin:0;font-size:15px;cursor:pointer}
details.mn[open] summary{color:var(--amb)}
.mn ol,.mn ul{padding-left:20px;margin:0 0 12px}
.mn li{margin:6px 0}
.mn p{margin:0 0 10px}
.mn .n{color:var(--mute)}
#tapModal{position:fixed;inset:0;z-index:40;background:rgba(12,23,27,.85);display:flex;align-items:center;justify-content:center;padding:20px}
.tbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:320px}
.tbox h3{margin:0 0 8px;font-size:16px}
#geoBox{font-size:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
</style>
</head>
<body>
<div id="stage" class="v">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="ov"></canvas>
  <div id="m1" class="mk"><i></i></div><div id="m2" class="mk"><i></i></div>
  <div id="cross"><b></b></div>
  <div id="msg"><div><div id="msgt"></div><button id="retry" class="pri">Увімкнути камеру</button></div></div>
</div>
<div id="top">
  <button class="tab on" data-m="size">Об'єкт</button>
  <button class="tab" data-m="ground">Земля</button>
  <button class="tab" data-m="height">Висота</button>
  <button class="tab" data-m="dim">Розмір</button>
  <button class="tab" data-m="pts">Точки</button>
  <button class="tab" data-m="scan">Сканер</button>
</div>
<div id="cmp" aria-label="Компас">
  <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="none" stroke="#8fa3a0" stroke-width="1.5"/><g id="rose"><path d="M13 3 L16 12 L10 12 Z" fill="#ff5a3c"/><path d="M13 23 L16 14 L10 14 Z" fill="#8fa3a0"/></g></svg>
  <b id="az">—</b><span id="card"></span>
</div>
<div id="tr">
  <button id="posB" class="tb">Позиція: вимк.</button>
  <button id="geoBtn" class="tb" title="GPS координати">📍 GPS</button>
  <button id="setB" class="tb" aria-label="Налаштування">⚙</button>
  <button id="manB" class="tb" aria-label="Інструкція">📖</button>
</div>
<div id="sheet">
  <div id="read"><span id="num">—</span><span id="unit">м</span><div id="sub"></div><button id="col" aria-label="Згорнути панель">⌄</button></div>
  <div id="warn"></div><div id="res"></div><div id="lvl" class="hide"></div>
  <div id="ctl">
    <div id="p-size" class="pn">
      <div class="row"><button id="pick">📚 Обрати об'єкт</button><input id="sz" type="number" step="0.001" min="0.001" inputmode="decimal"></div>
      <div class="row"><button class="ori">Міряю висоту ↕</button><input id="cd" type="number" step="0.1" min="0.3" inputmode="decimal" placeholder="Справжня відстань, м" style="flex:1.4;width:auto"><button id="cal">Калібрувати</button></div>
      <small id="kinfo"></small>
      <small>Постав маркери на краї об'єкта.</small>
    </div>
    <div id="p-dim" class="pn hide">
      <div class="row"><label>Відстань до об'єкта, м</label><input id="dd" type="number" step="0.01" min="0.1" inputmode="decimal"><button id="fromG">З «Земля»</button></div>
      <div class="row"><button class="ori">Міряю висоту ↕</button></div>
    </div>
    <div id="p-tilt" class="pn hide">
      <div class="row"><label>Висота камери над землею, м</label><input id="hh" type="number" step="0.01" min="0.1" inputmode="decimal"><button id="zero">Обнулити нахил</button></div>
      <button id="sens" class="pri hide" style="width:100%;margin-top:8px">Дозволити датчики</button>
    </div>
    <div id="p-ground" class="pn hide"><small>Торкнись екрана там, де ціль стоїть на землі.</small></div>
    <div id="p-height" class="pn hide">
      <div class="row"><label>Відстань, м</label><input id="hd" type="number" step="0.1" min="0.1" inputmode="decimal"></div>
      <div class="row"><button id="lo">1 · Низ</button><button id="hi">2 · Верх</button><button id="hr">Скинути</button></div>
    </div>
    <div id="p-pts" class="pn hide">
      <div class="row"><button id="addP" class="pri">＋ Точка</button><button id="delP">Видалити останню</button><button id="clrP">Очистити</button></div>
      <div id="plan"></div>
    </div>
    <div id="p-scan" class="pn hide">
      <div id="scl"></div>
      <small id="scs"></small>
      <div class="row"><label>Показувати</label><select id="scf"><option value="all">Усі об'єкти</option><option value="mov">Лише рухомі</option></select></div>
      <div class="row"><label>Модель</label><select id="scm"><option value="mobilenet_v2">Точна</option><option value="lite_mobilenet_v2">Легка</option></select></div>
      <div class="row"><label>Дальність</label><select id="scr"><option value="1">Звичайна</option><option value="2">Далека</option></select></div>
      <div class="row"><label>Мін. впевненість</label><input id="scc" type="range" min="20" max="80" step="5" value="35"><b id="scv" style="min-width:38px;text-align:right">35%</b></div>
      <small>Торкніться екрана для навчання AI та збереження об'єкта.</small>
    </div>
    <div class="row" id="bt1"><button id="frz">Стоп-кадр</button></div>
    <div class="row" id="bt2"><button id="ser">Серія ×10</button><button id="sa">Швидкість A</button><button id="sb">B</button></div>
    <div class="row hide" id="zwrap"><label>Зум</label><input id="zoom" type="range"><b id="zv" style="min-width:34px;text-align:right">1×</b></div>
  </div>
  <div class="ft">© 2026 БАРС</div>
</div>
<div id="tapModal" class="hide">
  <div class="tbox">
    <h3>🎯 Навчання AI / Об'єкт</h3>
    <div class="row"><input id="tName" type="text" placeholder="Назва об'єкта"></div>
    <div class="row"><input id="tH" type="number" step="0.05" min="0.1" placeholder="Висота, м"></div>
    <div id="geoBox">Координати цілі…</div>
    <div class="row" style="margin-top:12px">
      <button id="tSave" class="pri">Записати в AI</button>
      <button id="tCopyGeo" class="hide">📋 Копіювати</button>
      <button id="tClose">Закрити</button>
    </div>
  </div>
</div>
<script>
(function(){
const $=s=>document.querySelector(s),R=Math.PI/180;
const V=$('#vid'),stage=$('#stage'),cross=$('#cross'),sheet=$('#sheet');
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const med=a=>{const s=[...a].sort((x,y)=>x-y);return s[s.length>>1]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const U={m:[1,'м'],ft:[3.28084,'фт'],yd:[1.09361,'ярд']};
const CARD=['Пн','ПнСх','Сх','ПдСх','Пд','ПдЗх','Зх','ПнЗх'];

let mode='size',vert=true,frozen=false,frozenVal=null,zoom=1,eRaw=null,roll=0,inited=false;
let hrel=null,headAbs=null,absSeen=false,oBuf=[];
let p=[.25,.5],tgt={x:.5,y:.4},buf=[],eBuf=[],ser=null,spd=null,lastO=null,lastDist=null,hs={e1:null,e2:null};
let unit=store.get('u','m'),bias=store.get('b',0),camH=store.get('h',1.5),objSize=store.get('sz',1.75),objName=store.get('sn','Дорослий чоловік'),camKey='default';
let my=store.get('my',[]),pts=[],model=null,modelBase='',loading=false,scanMsg='',trk=[],nid=1,det=false,shake=false,lastList=0;
let smodel=store.get('sm','mobilenet_v2'),srange=store.get('sr','1'),sconf=store.get('sc',35);
let posMode=store.get('pos',false),locked=false,entered='';
let customClasses=store.get('customClasses',[]),currentGPS=null;

if(navigator.geolocation){
  navigator.geolocation.watchPosition(pos=>{
    currentGPS={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy};
  },err=>{},{enableHighAccuracy:true,maximumAge:5000});
}
function toMGRS(lat,lon){
  const zone=Math.floor((lon+180)/6)+1;
  const latBand='CDEFGHJKLMNPQRSTUVWX'[Math.floor((lat+80)/8)];
  return `${zone}${latBand} ${Math.round((lat%1)*100000)} ${Math.round((lon%1)*100000)}`;
}
function calcCoords(dist, az){
  if(!currentGPS||az==null)return null;
  const dLat=(dist*Math.cos(az*R)/6378137)*(180/Math.PI);
  const dLon=(dist*Math.sin(az*R)/(6378137*Math.cos(currentGPS.lat*R)))*(180/Math.PI);
  const tLat=currentGPS.lat+dLat, tLon=currentGPS.lon+dLon;
  return {lat:tLat.toFixed(6), lon:tLon.toFixed(6), mgrs:toMGRS(tLat,tLon)};
}

$('#geoBtn').onclick=()=>{
  if(!currentGPS)return say('GPS сигнал відсутній');
  say(`GPS: ${currentGPS.lat.toFixed(5)}, ${currentGPS.lon.toFixed(5)} | Азимут: ${Math.round(headAbs||0)}°`);
};

function fmt(m){const[k,l]=U[unit];if(unit==='m'&&m>=1000)return[(m/1000).toFixed(2),'км'];const v=m*k;return[v.toFixed(v>=100?0:v>=10?1:2),l]}
const fs=m=>fmt(m).join(' ');
const ef=m=>{const[k,l]=U[unit],v=m*k;return v.toFixed(v<1?2:1)+' '+l};
const say=t=>{$('#res').textContent=t};

function getK(){return 0.75}
function geo(){
  const vw=V.videoWidth||1280,vh=V.videoHeight||720,r=stage.getBoundingClientRect();
  return{r,s:Math.max(r.width/vw,r.height/vh),f:getK()*Math.max(vw,vh)*zoom};
}
function tElev(g){
  if(eRaw==null)return null;
  const off=Math.atan(((tgt.y-.5)*g.r.height/g.s)/g.f)/R;
  return eRaw-bias-off;
}
function groundPt(ex,hd,g){
  const e=ex*R,h=hd*R;
  const u=((tgt.x-.5)*g.r.width/g.s)/g.f,v=((tgt.y-.5)*g.r.height/g.s)/g.f;
  const F=[Math.cos(e)*Math.sin(h),Math.cos(e)*Math.cos(h),Math.sin(e)];
  const Rt=[Math.cos(h),-Math.sin(h),0];
  const D=[Math.sin(e)*Math.sin(h),Math.sin(e)*Math.cos(h),-Math.cos(e)];
  const r=[F[0]+u*Rt[0]+v*D[0],F[1]+u*Rt[1]+v*D[1],F[2]+u*Rt[2]+v*D[2]];
  if(r[2]>=-0.02)return null;
  const t=camH/-r[2];
  return{x:r[0]*t,y:r[1]*t};
}
function compute(){
  const g=geo();
  if(mode==='size'||mode==='dim'){
    const len=vert?g.r.height:g.r.width,span=Math.abs(p[1]-p[0])*len/g.s;
    if(span<4)return{warn:'Розведи маркери'};
    if(mode==='size'){const d=objSize*g.f/span;return{d,err:d*(2/g.s)/span}}
    const D=parseFloat($('#dd').value);
    if(!(D>0))return{warn:'Задай відстань'};
    const s=span*D/g.f;return{d:s,err:s*(2/g.s)/span};
  }
  const t=tElev(g);
  if(t==null)return{warn:'Чекаю датчик нахилу…'};
  if(mode==='height')return{t};
  if(t>-1.2)return{warn:'Ціль вище горизонту',t};
  const r=-t*R;
  return{d:camH/Math.tan(r),err:camH*.0087/Math.pow(Math.sin(r),2),L:camH/Math.sin(r),t};
}

function bearing(a,b,g){
  const E=-(Math.cos(g)*Math.sin(a)*Math.sin(b)+Math.cos(a)*Math.sin(g));
  const N=-(Math.sin(a)*Math.sin(g)-Math.cos(a)*Math.cos(g)*Math.sin(b));
  return (Math.atan2(E,N)/R+360)%360;
}
function setHead(v){if(headAbs==null)headAbs=v;else{const d=((v-headAbs+540)%360)-180;headAbs=(headAbs+d*.2+360)%360}}
window.addEventListener('deviceorientation',e=>{
  if(e.beta==null)return;
  const a=(e.alpha||0)*R,b=e.beta*R,g=(e.gamma||0)*R;
  eRaw=Math.asin(clamp(-Math.cos(b)*Math.cos(g),-1,1))/R;
  roll=e.gamma||0;
  if(e.alpha!=null)hrel=bearing(a,b,g);
  if(typeof e.webkitCompassHeading==='number'&&!absSeen)setHead(e.webkitCompassHeading);
},true);
window.addEventListener('deviceorientationabsolute',e=>{
  if(e.alpha!=null&&e.beta!=null){absSeen=true;setHead(bearing(e.alpha*R,e.beta*R,(e.gamma||0)*R))}
},true);

function compass(){
  const h=headAbs;
  $('#az').textContent=h==null?'—':Math.round(h)+'°';
  $('#card').textContent=h==null?'':CARD[Math.round(h/45)%8];
  $('#rose').setAttribute('transform','rotate('+(h==null?0:-h)+' 13 13)');
}

async function startCam(){
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'environment'}});
    V.srcObject=st;$('#msg').style.display='none';
  }catch(e){$('#msg').style.display='flex'}
}
$('#retry').onclick=()=>startCam();

/* Тап-детекція та Навчання AI */
stage.addEventListener('pointerdown',e=>{
  if(mode==='scan'){
    const r=stage.getBoundingClientRect();
    const tx=e.clientX-r.left, ty=e.clientY-r.top;
    const matched=trk.find(k=>{
      const g=geo(),vw=V.videoWidth||1280,vh=V.videoHeight||720;
      const ox=(r.width-vw*g.s)/2, oy=(r.height-vh*g.s)/2;
      const X=k.box[0]*g.s+ox, Y=k.box[1]*g.s+oy, Wd=k.box[2]*g.s, Ht=k.box[3]*g.s;
      return tx>=X && tx<=X+Wd && ty>=Y && ty<=Y+Ht;
    });
    const target=matched||{name:'Ціль', H:1.75, d:15.0};
    $('#tName').value=target.name; $('#tH').value=target.H;
    
    const coords=calcCoords(target.d, headAbs);
    if(coords){
      $('#geoBox').innerHTML=`WGS84: ${coords.lat}, ${coords.lon}<br>MGRS: <b>${coords.mgrs}</b>`;
      $('#tCopyGeo').classList.remove('hide');
      $('#tCopyGeo').onclick=()=>{
        navigator.clipboard.writeText(`Ціль: ${target.name}\nДистанція: ${target.d.toFixed(1)}м\nMGRS: ${coords.mgrs}`);
        say('Координати скопійовано ✓');
      };
    }
    $('#tapModal').classList.remove('hide');
    return;
  }
  if(mode!=='ground'&&mode!=='height'&&mode!=='pts')return;
  const r=stage.getBoundingClientRect();
  tgt={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};
});

$('#tClose').onclick=()=>$('#tapModal').classList.add('hide');
$('#tSave').onclick=()=>{
  const name=$('#tName').value.trim(), h=parseFloat($('#tH').value);
  if(!name||!(h>0))return say('Введіть назву та висоту');
  customClasses.push({name, h});
  store.set('customClasses', customClasses);
  $('#tapModal').classList.add('hide');
  say(`Ціль «${name}» збережено в AI ✓`);
};

async function ensureModel(){
  if(model||loading)return;
  loading=true;
  try{
    if(!window.tf)await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');
    if(!window.cocoSsd)await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js');
    model=await cocoSsd.load({base:smodel});
  }catch(e){scanMsg='Помилка моделі'}
  loading=false;
}
function loadScript(u){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}

async function detectStep(){
  if(det||!model||mode!=='scan'||V.readyState<2)return;
  det=true;
  try{
    let out=await model.detect(V,25,sconf/100);
    const g=geo();
    trk=out.map((o,i)=>{
      let n=o.class, h=1.75;
      if(customClasses.length){n=customClasses[customClasses.length-1].name; h=customClasses[customClasses.length-1].h;}
      return {id:i, name:n, H:h, d:(h*g.f)/o.bbox[3], box:o.bbox, score:o.score};
    });
  }catch(e){}
  det=false;
}

function renderList(now){
  if(now-lastList<250)return;lastList=now;
  $('#scl').innerHTML=trk.slice(0,5).map(k=>`<div class="sr"><span class="dot"></span><span class="sn">${k.name} <small>[${Math.round(k.score*100)}%]</small></span><b>${fs(k.d)}</b></div>`).join('')||'<small>Сканування об\'єктів…</small>';
}

function view(){
  if(mode==='scan'){
    const v=trk.sort((a,b)=>a.d-b.d);
    if(!v.length)return{warn:'Шукаю об\'єкти…'};
    return{d:v[0].d,err:v[0].d*.15,sub:v[0].name};
  }
  const raw=compute();
  if(raw.d==null)return raw;
  return{d:raw.d,err:raw.err,sub:raw.sub,raw:raw.d};
}

function loop(now){
  const o=view();
  if(o.d!=null&&isFinite(o.d)){
    const[n,u]=fmt(o.d);$('#num').textContent=n;$('#unit').textContent=u;
    $('#sub').textContent=[o.err!=null?'±'+ef(o.err):'',o.sub||''].filter(Boolean).join(' · ');
  }else{$('#num').textContent='—';$('#sub').textContent=''}
  $('#warn').textContent=o.warn||'';
  detectStep();compass();
  if(mode==='scan')renderList(now);
  requestAnimationFrame(loop);
}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));
  document.querySelectorAll('.pn').forEach(x=>x.classList.toggle('hide',!x.id.includes(mode)));
  if(mode==='scan')ensureModel();
});

startCam();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
